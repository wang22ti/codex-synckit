name: Bug report
description: Report reproducible incorrect or unsafe behavior
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include conversations, memory contents, credentials, private paths, or generated CodexKit files.
        Report security vulnerabilities through the private security link instead.
  - type: input
    id: version
    attributes:
      label: Codex SyncKit version
      placeholder: 0.1.0-alpha
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Windows, PowerShell, OneDrive, and Codex/ChatGPT versions
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: Provide minimal steps using sanitized paths and test data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, conversation text, memory contents, and private local paths.
          required: true
