name: test

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Public release gate
        shell: powershell
        run: .\tools\Test-PublicRelease.ps1
      - name: Build and verify release archive
        shell: powershell
        run: .\tools\Build-Release.ps1
      - name: Node regression tests
        shell: powershell
        run: node --test .\skill\scripts\tests\Merge-CodexSidebarState.test.mjs .\skill\scripts\tests\Repair-CodexSessionIndex.test.mjs .\skill\scripts\tests\Repair-CodexThreadCatalog.test.mjs
      - name: PowerShell end-to-end tests
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\skill\scripts\tests\Install-CodexSyncKit.test.ps1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\skill\scripts\tests\Export-CodexKitDefaults.test.ps1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\skill\scripts\tests\Sync-CodexDesktopState.test.ps1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\subsystems\memory-and-improvement\scripts\tests\windows-maintenance-test.ps1

  memory-subsystem:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Shell syntax and regression tests
        shell: bash
        run: bash ./tools/Test-MemorySubsystem.sh
