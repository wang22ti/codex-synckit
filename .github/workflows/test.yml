name: test

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Public release gate
        shell: powershell
        run: .\tools\Test-PublicRelease.ps1
      - name: Build and verify release archive
        shell: powershell
        run: .\tools\Build-Release.ps1
      - name: Node regression tests
        shell: powershell
        run: |
          $tests = @(Get-ChildItem .\skill\scripts\tests\*.test.mjs | ForEach-Object { $_.FullName })
          node --test @tests
          if ($LASTEXITCODE -ne 0) { throw "Node regression tests failed." }
      - name: PowerShell end-to-end tests
        shell: powershell
        run: |
          foreach ($test in Get-ChildItem .\skill\scripts\tests\*.test.ps1) {
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File $test.FullName
            if ($LASTEXITCODE -ne 0) { throw "PowerShell regression failed: $($test.Name)" }
          }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\subsystems\memory-and-improvement\scripts\tests\windows-maintenance-test.ps1
          if ($LASTEXITCODE -ne 0) { throw "Windows memory maintenance tests failed." }

  memory-subsystem:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Shell syntax and regression tests
        shell: bash
        run: bash ./tools/Test-MemorySubsystem.sh
