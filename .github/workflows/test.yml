name: test

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Public release gate
        shell: powershell
        run: .\tools\Test-PublicRelease.ps1
      - name: Node regression tests
        shell: powershell
        run: node --test .\skill\scripts\tests\Merge-CodexSidebarState.test.mjs .\skill\scripts\tests\Repair-CodexSessionIndex.test.mjs .\skill\scripts\tests\Repair-CodexThreadCatalog.test.mjs
      - name: PowerShell end-to-end tests
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\skill\scripts\tests\Export-CodexKitDefaults.test.ps1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\skill\scripts\tests\Sync-CodexDesktopState.test.ps1
